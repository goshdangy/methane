name: Quarto Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Show files
        run: ls -R

      - name: Check Quarto version
        run: quarto check

      - name: Render site
        run: quarto render